name: Reference data

# Fetches the external data the engine is built against:
#   - the Comprehensive Rules (URL in docs/rules/SOURCE.txt), parsed and committed to main
#   - the full compiled card DB from Scryfall, played card by card in the sandbox and published with
#     its coverage report and the sandbox's results to the `reports` branch (and as a build artifact)
# Runs weekly, on demand, and whenever the parsers, the engine or the rules source change.
#
# A push does only what the change calls for: the card DB is compiled again only if Scryfall's data or the compiler
# changed, and a card is played again only if its definition changed or its last play ran through code that did
# (packages/engine/scripts/lib/impact.ts). The weekly run and a run started by hand play every card, and hold the
# last run to it: a card that would have kept its result and plays differently fails the run. So does a push whose
# commit message has a line "Checks: full".
on:
  push:
    branches: [main]
    paths:
      - docs/rules/SOURCE.txt
      - packages/rules/src/**
      - packages/compiler/src/**
      - packages/schema/src/**
      - packages/engine/src/**
      - packages/engine/scripts/**
      - .github/workflows/data.yml
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-data
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the Comprehensive Rules
        run: |
          url="$(head -n1 docs/rules/SOURCE.txt)"
          curl -fsSL -A "MagicEngine/0.1 (rules sync)" "$url" -o /tmp/cr.txt
          # Older releases were Windows-1252; normalise to UTF-8 with LF endings.
          if ! iconv -f UTF-8 -t UTF-8 /tmp/cr.txt > /dev/null 2>&1; then
            iconv -f WINDOWS-1252 -t UTF-8 /tmp/cr.txt > /tmp/cr8.txt && mv /tmp/cr8.txt /tmp/cr.txt
          fi
          sed -i 's/\r$//' /tmp/cr.txt
          mv /tmp/cr.txt docs/rules/MagicCompRules.txt
      - name: Parse
        # Commit the raw text even if parsing fails, so the parser can be fixed against it.
        run: pnpm rules:parse || echo "::warning::Comprehensive Rules parse failed"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/MagicCompRules.txt
          [ -f docs/rules/rules.json ] && git add docs/rules/rules.json
          if git diff --cached --quiet; then echo "rules unchanged"; exit 0; fi
          git commit -m "Update Comprehensive Rules from $(head -n1 docs/rules/SOURCE.txt)"
          git pull --rebase origin main
          git push origin HEAD:main

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The last run's card DB and checks, to go by and to compare with
        run: |
          mkdir -p /tmp/last
          if git fetch --depth 1 origin reports; then
            for f in cards.json.gz cards.meta.json coverage.json coverage.md checks.json.gz; do
              git show "FETCH_HEAD:$f" > "/tmp/last/$f" || rm -f "/tmp/last/$f"
            done
          fi
      - name: Download and compile every card
        # The last run's card DB as it is, if Scryfall's data and the compiler are what they were for it.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          pnpm cards:build --reuse /tmp/last 2>&1 | tee /tmp/cards-build.log
      - name: Coverage summary
        run: cat apps/web/public/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compiler/engine contract on every card
        # Fails if the compiler emitted a node tag the engine has no handler for. (The DB as compiled just now, or by
        # this same compiler: its text isn't read again.)
        run: |
          set -o pipefail
          pnpm cards:reparse --as-is 2>&1 | tee /tmp/reparse.log
      - name: Play the cards in the sandbox, and correct the grades by it
        # A card with a certain problem isn't fully automatic, however much of it was read. Fails (after everything is
        # published, below) if a card left the pool, if a card got a certain problem it didn't have, or if more cards
        # stopped being fully automatic than the commit message's "Regrades: N" line allows. The failure is an alarm,
        # raised once: what this run publishes is what the next run compares with.
        #
        # On a push, the cards the change can have touched; the rest keep the last run's result. Every card on the
        # weekly run, on one started by hand, and for a commit that says "Checks: full" — and then a card that would
        # have kept its result and plays differently fails the run too.
        run: |
          set -o pipefail
          allowed="$(git log -1 --format=%B | sed -n 's/^Regrades: *\([0-9][0-9]*\).*/\1/p' | head -n1)"
          full=""
          if [ "$GITHUB_EVENT_NAME" != push ] || git log -1 --format=%B | grep -qiE '^Checks: *full'; then full="--full"; fi
          status=0
          pnpm cards:check --jobs "$(nproc)" $full --commit "$GITHUB_SHA" --out /tmp/checks.json.gz \
            --baseline /tmp/last/checks.json.gz --previous-pool /tmp/last/cards.json.gz \
            --report /tmp/changes.md --save ../../apps/web/public --strict --allow-regrades "${allowed:-0}" 2>&1 | tee /tmp/checks.log || status=$?
          echo "$status" > /tmp/checks.status
          [ -f /tmp/changes.md ] && cat /tmp/changes.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Fuzz games with random decks from the full card pool
        # Fails on a crash, a listed move the engine refuses, or a broken invariant. A move the engine would take and
        # never listed is reported (here and in fuzz.log) without failing: these games find such gaps by chance, old
        # ones as a rule, and the gate before each commit (tools/dev/fuzz-all.sh) is where they fail.
        #
        # One process per core. A push looks for unlisted moves in fewer states; the weekly run plays twice the games
        # and looks as often as the gate does.
        run: |
          set -o pipefail
          games=60; probe=120
          if [ "$GITHUB_EVENT_NAME" != push ]; then games=120; probe=40; fi
          pnpm fuzz --as-is --jobs "$(nproc)" --games "$games" --probe "$probe" --seed "$GITHUB_RUN_NUMBER" --report-unlisted 2>&1 | tee /tmp/fuzz.log
          if grep -q "unlisted: [1-9]" /tmp/fuzz.log; then
            echo "::warning::The fuzz games found moves the engine takes but never lists (fuzz.log on the reports branch)."
            { echo; echo "### Moves the engine takes but never lists"; echo; echo '```'; sed -n '/unlisted: /,$p' /tmp/fuzz.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: card-db
          path: |
            apps/web/public/cards.json.gz
            apps/web/public/cards.meta.json
            apps/web/public/coverage.json
            apps/web/public/coverage.md
          retention-days: 30
      - name: Publish to the reports branch
        # Runs on failure too, so the build log is readable without access to the Actions UI.
        if: always()
        run: |
          mkdir -p /tmp/reports
          for f in cards.json.gz cards.meta.json coverage.json coverage.md; do
            [ -f "apps/web/public/$f" ] && cp "apps/web/public/$f" /tmp/reports/
          done
          # (Beside the card DB on the branch, not in the app's own files: the app has no use for it.)
          [ -f /tmp/checks.json.gz ] && cp /tmp/checks.json.gz /tmp/reports/checks.json.gz
          [ -f /tmp/changes.md ] && cp /tmp/changes.md /tmp/reports/changes.md
          [ -f /tmp/checks.log ] && cp /tmp/checks.log /tmp/reports/checks.log
          [ -f /tmp/cards-build.log ] && tail -c 200000 /tmp/cards-build.log > /tmp/reports/build.log
          [ -f /tmp/reparse.log ] && cp /tmp/reparse.log /tmp/reports/reparse.log
          [ -f /tmp/fuzz.log ] && cp /tmp/fuzz.log /tmp/reports/fuzz.log
          # The card checks give their verdict in the last step, after this one: say it here too.
          status="${{ job.status }}"
          [ "$(cat /tmp/checks.status 2>/dev/null || echo 0)" != 0 ] && status="failure (card checks: see changes.md and checks.log)"
          echo "$status" > /tmp/reports/status.txt
          cd /tmp/reports
          git init -q -b reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Card DB and coverage for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" reports
      - name: Card checks verdict
        run: |
          status="$(cat /tmp/checks.status 2>/dev/null || echo 1)"
          if [ "$status" != 0 ]; then
            echo "::error::The card checks failed: see the summary of this run (or changes.md and checks.log on the reports branch)."
            exit 1
          fi
